<!DOCTYPE html>
<html class="mobsante-splash-active">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="MobSanté — Interface de mobilisation des professionnels de santé">
  <meta name="application-name" content="MobSanté">
  <meta name="theme-color" content="#F6F7F8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MobSanté">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="preload" href="assets/assets/branding/mobsante_pictogram_transparent.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/assets/branding/mobilization_flame.png" as="image" fetchpriority="high">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <title>MobSanté — Incendies Gironde</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #F6F7F8;
      overflow: hidden;
    }

    html.mobsante-splash-active,
    html.mobsante-splash-active body {
      background: #10233E;
    }

    #startup-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      padding: max(20px, env(safe-area-inset-top)) 28px
        max(20px, env(safe-area-inset-bottom));
      overflow: hidden;
      background: #10233E;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .startup-splash__content {
      width: min(100%, 420px);
      text-align: center;
      visibility: hidden;
    }

    html.mobsante-splash-composed .startup-splash__content {
      visibility: visible;
    }

    .startup-splash__logo {
      position: relative;
      width: min(246px, 58vw, 34vh);
      aspect-ratio: 1;
      margin: 0 auto 30px;
    }

    .startup-splash__pictogram {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .startup-splash__mobilization-symbol {
      position: absolute;
      top: -8%;
      right: -6%;
      width: 48%;
      height: 54%;
      object-fit: contain;
      transform: scale(1.72);
    }

    .startup-splash__title {
      margin: 0;
      font-size: clamp(36px, 10vw, 42px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -1.1px;
    }

    .startup-splash__subtitle {
      margin: 10px 0 0;
      color: #D9E3F1;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: .2px;
    }

    .startup-splash__signature {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 58px;
      color: #58A5FF;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 3.2px;
      white-space: nowrap;
    }

    .startup-splash__signature::before,
    .startup-splash__signature::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, .24);
    }

  </style>
</head>
<body>
  <div id="startup-splash" aria-hidden="true">
    <div class="startup-splash__content">
      <div class="startup-splash__logo">
        <img
          class="startup-splash__pictogram"
          src="assets/assets/branding/mobsante_pictogram_transparent.png"
          alt=""
          width="1254"
          height="1254"
        >
        <img
          class="startup-splash__mobilization-symbol"
          src="assets/assets/branding/mobilization_flame.png"
          alt=""
          width="1254"
          height="1254"
        >
      </div>
      <h1 class="startup-splash__title">MobSanté</h1>
      <p class="startup-splash__subtitle">Incendies Gironde</p>
      <div class="startup-splash__signature">URPS MK NA</div>
    </div>
  </div>
  <script>
    performance.mark('mobsante-launch-shell-visible');
    (() => {
      const splash = document.getElementById('startup-splash');
      const images = Array.from(splash.querySelectorAll('img'));
      const decodeImage = (image) => {
        const decode = () => typeof image.decode === 'function'
          ? image.decode().catch(() => {})
          : Promise.resolve();
        if (image.complete) return decode();
        return new Promise((resolve) => {
          image.addEventListener('load', () => decode().then(resolve), {
            once: true,
          });
          image.addEventListener('error', resolve, { once: true });
        });
      };

      Promise.all(images.map(decodeImage)).then(() => {
        requestAnimationFrame(() => {
          if (!splash.isConnected) return;
          document.documentElement.classList.add(
            'mobsante-splash-composed',
          );
          performance.mark('mobsante-native-splash-composed');
          performance.measure(
            'mobsante-native-splash-composition',
            'mobsante-launch-shell-visible',
            'mobsante-native-splash-composed',
          );
        });
      });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
